# Default run configuration.
#
# Split boundaries are deliberately absent: they are code constants in
# fds/splits.py and are not configurable (D-13).

seed = 20260921

[uid]
recipe_name = "v1_card1_addr1_d1n"

[graph]
# Measured, not guessed. The ceiling and the weight floor were chosen from the
# percolation sweep in reports/percolation.json: at a ceiling of 100 with no
# weight floor the largest component holds 94% of linked clients, failing
# plan.md's own <50% verification rule. At 50/2 it holds 14.5%.
#
# Linking attributes are the identity block, not the plan's original four.
# card1/card2/addr1 are uid components, so linking on them re-imports the Trap A
# labelling artefact (D-38); P_emaildomain is a hub by construction.
hub_min_degree = 2
hub_max_degree = 50
min_edge_weight = 2
link_types = ["DeviceInfo", "id_31", "id_33", "id_30", "id_17", "id_19", "id_20", "id_13"]

[snapshots]
cadence_days = 14
first_end_day = 28

[model]
kind = "lightgbm"
num_boost_round = 2000
early_stopping_rounds = 100

[model.params]
objective = "binary"
metric = "auc"
learning_rate = 0.03
num_leaves = 64
min_data_in_leaf = 100
feature_fraction = 0.7
bagging_fraction = 0.8
bagging_freq = 1
lambda_l2 = 1.0
verbose = -1
