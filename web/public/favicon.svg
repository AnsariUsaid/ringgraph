<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ringgraph. The risk-signature glyph: four bars in the fixed axis order
       (density, synchrony, concentration, tightness), the last one flagged.
       Hand-written to match src/components/Mark.tsx, which a favicon cannot
       import. Bar heights are the same 0.41 / 0.76 / 0.53 / 1 ratios, on a
       38px span with a common baseline. If one changes, change both.

       The tinted plate is not decoration: the bars alone are thin enough to
       disappear against a dark browser chrome at 16px. -->
  <rect width="64" height="64" rx="15" fill="#f4f1ea"/>
  <rect x="10.3" y="35.4" width="8.6" height="15.6" rx="2.8" fill="#3b2bd9" opacity="0.34"/>
  <rect x="21.9" y="22.1" width="8.6" height="28.9" rx="2.8" fill="#3b2bd9" opacity="0.56"/>
  <rect x="33.5" y="30.9" width="8.6" height="20.1" rx="2.8" fill="#3b2bd9" opacity="0.78"/>
  <rect x="45.1" y="13.0" width="8.6" height="38.0" rx="2.8" fill="#b41d3c"/>
</svg>
